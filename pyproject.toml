[project]
name = "sd_merger"
version = "0.0.1"
dependencies = [
    "bayesian-optimization>=3.2.1",
    "gradio>=6.9.0",
    "huggingface-hub>=1.7.1",
    "hyperopt>=0.2.7",
    "matplotlib>=3.10.8",
    "sd-mecha>=1.1.3",
    "seaborn>=0.13.2",
    "setuptools<82",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "transformers>=5.3.0",
]
requires-python = ">=3.13"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128" },
]
torchvision = [
  { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  "venv",
  ".venv",
  "refrence",
  "lib",
  "models",
  ".pytest_tmp",
  "tmp*",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = ["main.py", "module", "ui"]
exclude = '(^venv/|^\.venv/|^refrence/|^lib/|^models/|^tests/|^\.pytest_tmp/|^tmp.*)'
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
warn_unused_ignores = true
show_error_codes = true
pretty = true
