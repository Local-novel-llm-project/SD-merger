[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  "venv",
  ".venv",
  "refrence",
  "lib",
  "models",
  ".pytest_tmp",
  "tmp*",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = ["main.py", "module", "ui"]
exclude = '(^venv/|^\.venv/|^refrence/|^lib/|^models/|^tests/|^\.pytest_tmp/|^tmp.*)'
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
warn_unused_ignores = true
show_error_codes = true
pretty = true
